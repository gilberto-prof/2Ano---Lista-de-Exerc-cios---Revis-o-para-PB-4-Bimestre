                opcoes: ["$36\\pi\\text{ cm}^3$", "$108\\pi\\text{ cm}^3$", "$27\\pi\\text{ cm}^3$", "$12\\pi\\text{ cm}^3$", "$48\\pi\\text{ cm}^3$"],
                correta: 0,
                resolucao: "O volume da esfera é $V = \\frac{4}{3}\\pi r^3$.<br>$$V = \\frac{4}{3}\\pi (3^3) = \\frac{4}{3}\\pi (27) = 4 \\cdot 9 \\pi = 36\\pi\\text{ cm}^3$$"
            },
            {

                enunciado: "Uma esfera tem volume $V = 288\\pi\\text{ cm}^3$. Qual é a sua área de superfície?",
                opcoes: ["$144\\pi\\text{ cm}^2$", "$72\\pi\\text{ cm}^2$", "$288\\pi\\text{ cm}^2$", "$36\\pi\\text{ cm}^2$", "$216\\pi\\text{ cm}^2$"],
                correta: 0,
                resolucao: "1) $V = \\frac{4}{3}\\pi r^3 = 288\\pi \\implies r^3 = 288 \\cdot \\frac{3}{4} = 216 \\implies r = 6\\text{ cm}$.<br>2) Área: $A = 4\\pi r^2 = 4\\pi (6^2) = 4\\pi \\cdot 36 = 144\\pi\\text{ cm}^2$."
            },
            {
                id: 28, temaId: 8, temaNome: "Tema 8 — Esferas: Áreas e Volume",
                enunciado: "A intersecção de um plano com uma esfera de raio $R = 10\\text{ cm}$ gera uma seção circular a uma distância $d = 6\\text{ cm}$ do centro da esfera. Qual o raio $r$ dessa seção circular?",
                opcoes: ["8 cm", "4 cm", "5 cm", "7 cm", "6 cm"],
                correta: 0,

            {

                opcoes: ["$7.234,56\\text{ cm}^3$", "$2.411,52\\text{ cm}^3$", "$1.808,64\\text{ cm}^3$", "$9.000,00\\text{ cm}^3$", "$5.425,92\\text{ cm}^3$"],
                correta: 0,

            },
            {
                id: 30, temaId: 9, temaNome: "Tema 9 — Esferas: Situação-Problema",
                enunciado: "Deseja-se pintar totalmente a superfície externa de 10 globos terrestres esféricos decorativos com raio de $20\\text{ cm}$ cada. Qual a área total a ser pintada em $\\text{m}^2$? (Use $\\pi \\approx 3,14$).",
                opcoes: ["$5,024\\text{ m}^2$", "$0,5024\\text{ m}^2$", "$50,24\\text{ m}^2$", "$2,512\\text{ m}^2$", "$10,048\\text{ m}^2$"],
                correta: 0,
                resolucao: "1) Área de 1 globo: $A = 4\\pi r^2 = 4 \\cdot 3,14 \\cdot (20^2) = 12,56 \\cdot 400 = 5024\\text{ cm}^2$.<br>2) Área de 10 globos: $5024 \\cdot 10 = 50240\\text{ cm}^2$.<br>3) Convertendo para $\\text{m}^2$: $\\frac{50240}{10000} = 5,024\\text{ m}^2$."
            },
            {
                id: 31, temaId: 9, temaNome: "Tema 9 — Esferas: Situação-Problema",
                enunciado: "Um sorveteiro despeja uma bola esférica de sorvete de $6\\text{ cm}$ de diâmetro perfeitamente dentro de uma casquinha cônica de $6\\text{ cm}$ de diâmetro e $10\\text{ cm}$ de altura. Se o sorvete derreter inteiramente dentro da casquinha, o líquido vai transbordar?",
                opcoes: [
                    "Não, pois o volume do sorvete ($36\\pi$) é menor que a capacidade da casquinha ($30\\pi$).",
                    "Sim, pois o volume do sorvete ($36\\pi$) supera a capacidade da casquinha ($30\\pi$).",
                    "Não, pois ambos possuem exatamente o mesmo volume ($30\\pi$).",
                    "Sim, pois o volume do sorvete ($288\\pi$) é muito superior.",
                    "Não, pois o sorvete ocupa apenas metade da casquinha."
                ],
                correta: 1,
                resolucao: "1) Raio do sorvete e da casquinha: $r = 3\\text{ cm}$.<br>2) Volume da esfera de sorvete: $V_e = \\frac{4}{3}\\pi (3^3) = 36\\pi\\text{ cm}^3$.<br>3) Capacidade da casquinha cônica: $V_c = \\frac{1}{3}\\pi (3^2)(10) = 30\\pi\\text{ cm}^3$.<br>Como $36\\pi > 30\\pi$, o sorvete **vai transbordar** ao derreter."
            },
            {
                id: 32, temaId: 9, temaNome: "Tema 9 — Esferas: Situação-Problema",
                enunciado: "Um reservatório esférico de gás possui $6\\text{ m}$ de diâmetro. Sabendo que o gás custa $\\text{R\\$}$ 20,00 por $\\text{m}^3$, qual é o valor total do combustível necessário para encher completamente esse reservatório? (Use $\\pi \\approx 3,14$).",
                opcoes: ["R$ 2.260,80", "R$ 4.521,60", "R$ 18.086,40", "R$ 1.130,40", "R$ 3.600,00"],
                correta: 0,
                resolucao: "1) Raio $r = 3\\text{ m}$.<br>2) Volume $V = \\frac{4}{3} \\cdot 3,14 \\cdot (3^3) = \\frac{4}{3} \\cdot 3,14 \\cdot 27 = 4 \\cdot 3,14 \\cdot 9 = 113,04\\text{ m}^3$.<br>3) Custo total: $113,04 \\cdot 20 = \\text{R\\$ } 2.260,80$."
            }
        ];

        let modoProfessorAtivo = false;
        let respostasAluno = {};

        function renderizarQuestoes(lista) {
            const container = document.getElementById('questoes-container');
            container.innerHTML = '';

            lista.forEach((q, index) => {
                const questaoCard = document.createElement('div');
                questaoCard.className = "bg-white p-6 rounded-xl shadow-sm border border-slate-200 transition-all";
                questaoCard.id = `q-card-${q.id}`;

                let opcoesHtml = q.opcoes.map((opcao, i) => {
                    return `
                        <button onclick="selecionarOpcao(${q.id}, ${i})" 
                                id="q-${q.id}-opt-${i}" 
                                class="opcao-card w-full text-left p-4 rounded-lg border border-slate-200 flex items-center gap-3 bg-slate-50 text-slate-700 font-medium hover:border-slate-300">
                            <span class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs font-semibold bg-white shrink-0">${String.fromCharCode(65 + i)}</span>
                            <span class="text-base">${opcao}</span>
                        </button>
                    `;
                }).join('');

                questaoCard.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-bold uppercase tracking-wider bg-blue-100 text-blue-700 px-3 py-1 rounded-full">${q.temaNome}</span>
                        <span class="text-xs text-slate-400 font-medium">Questão ${index + 1} de ${lista.length}</span>
                    </div>
                    <div class="text-lg font-medium text-slate-900 mb-4 leading-relaxed">${q.enunciado}</div>
                    <div class="space-y-2 mb-4">${opcoesHtml}</div>
                    
                    <div class="flex gap-3 items-center">
                        <button onclick="confirmarResposta(${q.id})" id="btn-confirmar-${q.id}" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded-lg transition-colors text-sm shadow-sm">
                            Confirmar Resposta
                        </button>
                    </div>

                    <div id="resolucao-${q.id}" class="hidden mt-4 p-4 rounded-lg bg-slate-50 border border-slate-200 text-slate-700 text-sm leading-relaxed">
                        <strong class="block text-slate-900 mb-1 font-semibold">Resolução Passo a Passo:</strong>
                        <div>${q.resolucao}</div>
                    </div>
                `;

                container.appendChild(questaoCard);
            });

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function selecionarOpcao(questaoId, opcaoIndex) {
            if (respostasAluno[questaoId]?.confirmado) return;

            const q = questoes.find(item => item.id === questaoId);
            q.opcoes.forEach((_, i) => {
                const btn = document.getElementById(`q-${questaoId}-opt-${i}`);
                if (btn) btn.classList.remove('border-blue-500', 'bg-blue-50');
            });

            const selectedBtn = document.getElementById(`q-${questaoId}-opt-${opcaoIndex}`);
            if (selectedBtn) selectedBtn.classList.add('border-blue-500', 'bg-blue-50');

            respostasAluno[questaoId] = { selecionada: opcaoIndex, confirmado: false };
        }

        function confirmarResposta(questaoId) {
            const info = respostasAluno[questaoId];
            if (!info || info.selecionada === undefined || info.confirmado) return;

            info.confirmado = true;
            const q = questoes.find(item => item.id === questaoId);

            q.opcoes.forEach((_, i) => {
                const btn = document.getElementById(`q-${questaoId}-opt-${i}`);
                btn.classList.add('desabilitado');
                btn.onclick = null;
                if (i === q.correta) {
                    btn.classList.add('correta');
                } else if (i === info.selecionada) {
                    btn.classList.add('incorreta');
                }
            });

            document.getElementById(`btn-confirmar-${questaoId}`).classList.add('hidden');
            document.getElementById(`resolucao-${questaoId}`).classList.remove('hidden');

            atualizarEstatisticas();
            if (window.MathJax) MathJax.typesetPromise();
        }

        function alternarModoProfessor() {
            modoProfessorAtivo = !modoProfessorAtivo;
            const btn = document.getElementById('btn-modo-professor');

            if (modoProfessorAtivo) {
                btn.classList.replace('bg-amber-500', 'bg-amber-600');
                btn.innerHTML = `<span>🔒 Sair do Modo Professor</span>`;
                
                questoes.forEach(q => {
                    const resDiv = document.getElementById(`resolucao-${q.id}`);
                    if (resDiv) resDiv.classList.remove('hidden');

                    const btnCorreto = document.getElementById(`q-${q.id}-opt-${q.correta}`);
                    if (btnCorreto) btnCorreto.classList.add('correta');
                });
            } else {
                btn.classList.replace('bg-amber-600', 'bg-amber-500');
                btn.innerHTML = `<span>👁️ Modo Professor / Estudo</span>`;

                questoes.forEach(q => {
                    if (!respostasAluno[q.id]?.confirmado) {
                        const resDiv = document.getElementById(`resolucao-${q.id}`);
                        if (resDiv) resDiv.classList.add('hidden');

                        const btnCorreto = document.getElementById(`q-${q.id}-opt-${q.correta}`);
                        if (btnCorreto) btnCorreto.classList.remove('correta');
                    }
                });
            }

            if (window.MathJax) MathJax.typesetPromise();
        }

        function atualizarEstatisticas() {
            const respondidas = Object.values(respostasAluno).filter(r => r.confirmado).length;
            let acertos = 0;

            Object.keys(respostasAluno).forEach(id => {
                const r = respostasAluno[id];
                if (r.confirmado) {
                    const q = questoes.find(item => item.id == id);
                    if (q && r.selecionada === q.correta) acertos++;
                }
            });

            document.getElementById('stat-respondidas').innerText = `${respondidas} / ${questoes.length}`;
            document.getElementById('stat-acertos').innerText = acertos;
            const pct = respondidas > 0 ? Math.round((acertos / respondidas) * 100) : 0;
            document.getElementById('stat-porcentagem').innerText = `${pct}%`;
        }

        function filtrarPorTema() {
            const temaVal = document.getElementById('filtro-tema').value;
            if (temaVal === 'todos') {
                renderizarQuestoes(questoes);
            } else {
                const filtradas = questoes.filter(q => q.temaId == temaVal);
                renderizarQuestoes(filtradas);
            }
        }

        // Inicializar aplicação
        renderizarQuestoes(questoes);
    </script>
